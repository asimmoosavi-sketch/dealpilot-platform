<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DealPilot | Global Price Comparison Engine</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-body: #f8fafc; 
            --bg-surface: #ffffff; 
            --text-primary: #0f172a; 
            --text-secondary: #475569; 
            --primary-dark: #1e3a8a; 
            --primary-hover: #1e40af; 
            --accent-yellow: #fbbf24; 
            --accent-yellow-text: #b45309;
            --border-light: #e2e8f0; 
            --shadow-md: 0 4px 6px -1px rgb(0 0 0 / 0.1);
            --shadow-lg: 0 10px 15px -3px rgb(0 0 0 / 0.1);
            --radius-lg: 12px; 
            --radius-pill: 9999px;
            --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; -webkit-font-smoothing: antialiased; }
        body { background-color: var(--bg-body); color: var(--text-primary); line-height: 1.5; }
        a { text-decoration: none; color: inherit; }
        button { border: none; background: none; cursor: pointer; font-family: inherit; transition: var(--transition); }

        .navbar { position: sticky; top: 0; z-index: 100; background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(8px); border-bottom: 1px solid var(--border-light); padding: 1rem 5%; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 1px 2px rgba(0,0,0,0.03); }
        .brand { font-size: 1.5rem; font-weight: 800; color: var(--primary-dark); display: flex; align-items: center; gap: 0.5rem; letter-spacing: -0.5px;}
        .nav-links { display: flex; gap: 2.5rem; align-items: center; } 
        .nav-link { font-weight: 600; color: var(--text-secondary); transition: var(--transition); } 
        .nav-link:hover { color: var(--primary-dark); }
        
        .nav-right { display: flex; align-items: center; gap: 2rem; }
        .wishlist-btn-header { position: relative; font-size: 1.4rem; color: var(--text-secondary); }
        .wishlist-badge { position: absolute; top: -5px; right: -8px; background: var(--accent-yellow); color: var(--text-primary); font-size: 0.7rem; font-weight: 800; height: 18px; min-width: 18px; border-radius: 50%; display: flex; align-items: center; justify-content: center; border: 2px solid white; }

        .hero { padding: 5rem 5% 4rem; text-align: center; max-width: 900px; margin: 0 auto; }
        .hero h1 { font-size: 3.5rem; font-weight: 800; margin-bottom: 1rem; color: var(--primary-dark); letter-spacing: -1px; line-height: 1.1; }
        .hero p { font-size: 1.25rem; color: var(--text-secondary); margin-bottom: 3rem; }

        .search-container { position: relative; max-width: 750px; margin: 0 auto; z-index: 50; }
        .search-box { display: flex; background: var(--bg-surface); border-radius: var(--radius-pill); padding: 0.5rem; box-shadow: var(--shadow-lg); border: 2px solid transparent; transition: var(--transition); }
        .search-box:focus-within { border-color: var(--primary-dark); }
        .search-icon { padding: 0 1.5rem; display: flex; align-items: center; color: var(--text-secondary); font-size: 1.2rem; }
        .search-input { flex: 1; border: none; outline: none; font-size: 1.1rem; color: var(--text-primary); width: 100%; }
        .search-btn { background: var(--primary-dark); color: white; padding: 1rem 2.5rem; border-radius: var(--radius-pill); font-weight: 600; font-size: 1.05rem; }

        .dropdown { position: absolute; top: calc(100% + 10px); left: 0; width: 100%; background: var(--bg-surface); border-radius: var(--radius-lg); box-shadow: var(--shadow-lg); border: 1px solid var(--border-light); display: none; overflow: hidden; text-align: left; }
        .dropdown.active { display: block; animation: slideDown 0.2s ease-out; }
        .dropdown-item { padding: 1rem 1.5rem; display: flex; align-items: center; gap: 1rem; cursor: pointer; border-bottom: 1px solid var(--border-light); }

        .main-content { max-width: 1200px; margin: 0 auto; padding: 2rem 5% 6rem; }
        .section-title { font-size: 1.75rem; font-weight: 800; color: var(--primary-dark); margin-bottom: 2rem; display: flex; align-items: center; gap: 0.5rem; }
        
        .deals-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 2rem; }
        .deal-card { background: var(--bg-surface); border-radius: var(--radius-lg); border: 1px solid var(--border-light); transition: var(--transition); display: flex; flex-direction: column; position: relative; }
        .deal-card:hover { transform: translateY(-5px); box-shadow: var(--shadow-lg); border-color: var(--primary-dark); }
        
        .card-badge { position: absolute; top: 1rem; left: 1rem; background: var(--accent-yellow); color: var(--accent-yellow-text); padding: 0.4rem 0.8rem; border-radius: var(--radius-pill); font-size: 0.75rem; font-weight: 800; z-index: 10; }
        .wishlist-btn { position: absolute; top: 1rem; right: 1rem; width: 36px; height: 36px; background: white; border-radius: 50%; display: flex; align-items: center; justify-content: center; color: #94a3b8; box-shadow: var(--shadow-md); }

        .card-img-wrapper { width: 100%; height: 220px; padding: 1.5rem; display: flex; justify-content: center; border-bottom: 1px solid var(--border-light); }
        .card-img { max-width: 100%; max-height: 100%; object-fit: contain; }
        .card-content { padding: 1.5rem; display: flex; flex-direction: column; flex: 1; }
        .platform-tag { color: var(--text-secondary); font-weight: 700; font-size: 0.8rem; text-transform: uppercase; }
        .product-title { margin-bottom: 1rem; font-size: 1.1rem; color: var(--text-primary); font-weight: 600; }
        .price-box { margin-top: auto; background: var(--bg-body); border-radius: 8px; padding: 1rem; margin-bottom: 1rem; }
        .current-price { font-size: 1.5rem; font-weight: 800; color: var(--primary-dark); }
        .buy-btn { width: 100%; padding: 0.9rem; border-radius: 8px; background: var(--primary-dark); color: white; font-weight: 600; text-align: center; }

        /* Skeleton Loading Bars */
        .skeleton-grid { display: none; }
        .sk-card { background: #eee; height: 400px; border-radius: 12px; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0% { opacity: 0.6; } 50% { opacity: 1; } 100% { opacity: 0.6; } }

        footer { background: var(--bg-surface); border-top: 1px solid var(--border-light); padding: 4rem 5% 2rem; margin-top: auto; }
        .footer-grid { max-width: 1200px; margin: 0 auto; display: grid; grid-template-columns: 1fr 1fr; gap: 4rem; }
        .footer-links { display: flex; gap: 2rem; align-items: center; justify-content: flex-end; }
        .footer-link { color: var(--text-secondary); font-weight: 600; }

        .modal-overlay { position: fixed; inset: 0; background: rgba(15,23,42,0.7); backdrop-filter: blur(4px); display: none; justify-content: center; align-items: center; z-index: 200; }
        .modal-overlay.active { display: flex; }
        .modal-box { background: var(--bg-surface); width: 90%; max-width: 600px; border-radius: var(--radius-lg); padding: 2.5rem; position: relative; }
        .modal-close { position: absolute; top: 1.5rem; right: 1.5rem; font-size: 1.5rem; }
    </style>
</head>
<body>
    <nav class="navbar">
        <a href="index.html" class="brand"><i class="fa-solid fa-plane-departure"></i> DealPilot</a>
        <div class="nav-links">
            <a href="Categories.html" class="nav-link">Categories</a>
            <a href="top-deals.html" class="nav-link">Top Deals</a>
            <a href="brands.html" class="nav-link">Brands</a>
        </div>
        <div class="nav-right">
            <button class="wishlist-btn-header">
                <i class="fa-regular fa-heart"></i>
                <span class="wishlist-badge">0</span>
            </button>
        </div>
    </nav>

    <main>
        <section class="hero">
            <h1>Smarter Shopping Starts Here.</h1>
            <p>Compare real-time prices across Amazon, Best Buy, Walmart, and more.</p>
            <div class="search-container">
                <div class="search-box">
                    <div class="search-icon"><i class="fa-solid fa-magnifying-glass"></i></div>
                    <input type="text" class="search-input" id="searchInput" placeholder="Search for items..." autocomplete="off">
                    <button class="search-btn" onclick="executeSearch()">Find Deals</button>
                </div>
                <div class="dropdown" id="searchDropdown"></div>
            </div>
        </section>

        <section class="main-content">
            <!-- RESULTS CONTAINER (Hidden by default) -->
            <div id="resultsContainer" style="display:none; margin-bottom: 4rem;">
                <h2 class="section-title" id="resultsTitle">Search Results</h2>
                <div class="deals-grid" id="dealsGrid"></div>
            </div>

            <!-- SKELETON LOADING -->
            <div class="deals-grid skeleton-grid" id="skeletonGrid">
                <div class="sk-card"></div><div class="sk-card"></div><div class="sk-card"></div>
            </div>

            <!-- EMPTY STATE -->
            <div id="emptyState" style="display:none; text-align:center; padding: 3rem;">
                <p>No live deals found. Try a different search.</p>
            </div>

            <!-- TOP SELLING (Hidden when searching) -->
            <div id="topSellingSection">
                <h2 class="section-title"><i class="fa-solid fa-fire" style="color:var(--accent-yellow);"></i> Top Selling Products</h2>
                <div class="deals-grid">
                    <div class="deal-card">
                        <div class="card-badge">HOT DEAL</div>
                        <div class="card-img-wrapper"><img src="https://dummyimage.com/400x400/f8fafc/1e3a8a.png?text=Sony+XM5" class="card-img"></div>
                        <div class="card-content">
                            <div class="platform-tag">Amazon</div>
                            <h3 class="product-title">Sony WH-1000XM5 Headphones</h3>
                            <div class="price-box"><span class="current-price">$328.00</span></div>
                            <button class="buy-btn">View Deal</button>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <footer>
        <div class="footer-grid">
            <div class="brand"><i class="fa-solid fa-plane-departure"></i> DealPilot</div>
            <div class="footer-links">
                <button class="footer-link" onclick="openModal('Policy')">Policy</button>
                <button class="footer-link" onclick="openModal('Terms & Conditions')">Terms & Conditions</button>
                <button class="footer-link" onclick="openModal('Affiliate Disclosure')">Affiliate Disclosure</button>
            </div>
        </div>
    </footer>

    <div class="modal-overlay" id="legalModal">
        <div class="modal-box">
            <button class="modal-close" onclick="closeModal()"><i class="fa-solid fa-xmark"></i></button>
            <h2 id="modalTitle"></h2>
            <div id="modalContent"></div>
        </div>
    </div>

    <script>
        const BACKEND_URL = "https://dealpilot-31p0.onrender.com/api";
        const input = document.getElementById('searchInput');
        const dropdown = document.getElementById('searchDropdown');

        // Autocomplete Logic
        input.addEventListener('input', async (e) => {
            const val = e.target.value.trim();
            if(val.length < 2) { dropdown.classList.remove('active'); return; }
            try {
                const res = await fetch(`${BACKEND_URL}/autocomplete?q=${val}`);
                const data = await res.json();
                if(data.suggestions.length > 0) {
                    dropdown.innerHTML = data.suggestions.map(m => `
                        <div class="dropdown-item" onclick="executeSearch('${m}')">${m}</div>
                    `).join('');
                    dropdown.classList.add('active');
                }
            } catch (e) { console.error(e); }
        });

        // LIVE FETCH LOGIC
        async function executeSearch(query) {
            const searchTerm = query || input.value;
            if(!searchTerm) return;
            
            dropdown.classList.remove('active');
            input.value = searchTerm;
            
            document.getElementById('topSellingSection').style.display = 'none';
            document.getElementById('resultsContainer').style.display = 'none';
            document.getElementById('emptyState').style.display = 'none';
            document.getElementById('skeletonGrid').style.display = 'grid';

            try {
                const response = await fetch(`${BACKEND_URL}/search?q=${encodeURIComponent(searchTerm)}`);
                const result = await response.json();
                const deals = result.data;

                document.getElementById('skeletonGrid').style.display = 'none';

                if (!deals || deals.length === 0) {
                    document.getElementById('emptyState').style.display = 'block';
                    return;
                }

                document.getElementById('dealsGrid').innerHTML = deals.map((d, idx) => `
                    <div class="deal-card">
                        <div class="card-badge">LIVE DEAL</div>
                        <div class="card-img-wrapper">
                            <img src="${d.image}" class="card-img" onerror="this.src='https://dummyimage.com/400x400/f8fafc/1e3a8a.png&text=Product'">
                        </div>
                        <div class="card-content">
                            <div class="platform-tag">${d.platform}</div>
                            <h3 class="product-title">${d.title}</h3>
                            <div class="price-box"><span class="current-price">${d.price}</span></div>
                            <a href="${d.url}" target="_blank" class="buy-btn">View Deal</a>
                        </div>
                    </div>
                `).join('');

                document.getElementById('resultsTitle').innerText = `Results for "${searchTerm}"`;
                document.getElementById('resultsContainer').style.display = 'block';

            } catch (error) {
                document.getElementById('skeletonGrid').style.display = 'none';
                alert("Backend waking up. Please try again in 30 seconds.");
            }
        }

        const modalData = {
            "Policy": "Privacy matters.",
            "Terms & Conditions": "Terms apply.",
            "Affiliate Disclosure": "We earn commission."
        };
        function openModal(t) { document.getElementById('modalTitle').innerText = t; document.getElementById('modalContent').innerText = modalData[t]; document.getElementById('legalModal').classList.add('active'); }
        function closeModal() { document.getElementById('legalModal').classList.remove('active'); }
    </script>
</body>
</html>
